[build]
builder = "NIXPACKS"
# Dependencies are installed during Nixpacks' [phases.install] (see nixpacks.toml).
# Keep buildCommand strictly to compilation so it never runs `npm ci` against the
# mounted /app/node_modules/.cache directory during the build phase (prevents EBUSY).
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
